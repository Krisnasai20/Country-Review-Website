    }
    
    .header-content {

      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .logo {
      font-size: 2em;
      font-weight: bold;
      color: #f39c12;
      text-transform: capitalize;
    }
    
    .nav-links {
      display: flex;
      gap: 20px;
    }
    
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: color 0.3s;
    }
    
    .nav-links a:hover, .nav-links a:focus {
      color: #f39c12;
    }
    
    .nav-links a.active {
      color: #f39c12;
    }
    
    .hero-section {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
      color: white;
    }
    
    .hero-title {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    
    .hero-subtitle {
      font-size: 1.2em;
      margin-bottom: 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #countrySearch {
      padding: 10px;
      width: 300px;
      margin: 20px auto;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      display: block;
    }
    
    .continent-tabs {
      margin-bottom: 30px;
    }
    
    .continent-tabs button {
      margin: 5px;
      padding: 10px 25px;
      font-size: 0.95em;
      border: none;
      background-color: #f39c12;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .continent-tabs button:hover, .continent-tabs button:focus {
      background: linear-gradient(45deg, #ffd700, #ff69b4, #00ffff, #800080);
      background-size: 200% 200%;
      animation: glitter 2s linear infinite;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    
    .continent-tabs button.active {
      background-color: #e67e22;
      transform: translateY(-2px);
    }

    @keyframes glitter {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .discover-btn {
      background-color: #e74c3c;
      color: white;
      padding: 10px 25px;
      border-radius: 5px;
      font-size: 0.95em;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    
    .discover-btn:hover, .discover-btn:focus {
      background: linear-gradient(45deg, #ffd700, #ff69b4, #00ffff, #800080);
      background-size: 200% 200%;
      animation: glitter 2s linear infinite;
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .country-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .country-card {
      background-color: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease forwards;
      cursor: pointer;
    }
    
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .country-card:nth-child(1) { animation-delay: 0.1s; }
    .country-card:nth-child(2) { animation-delay: 0.2s; }
    .country-card:nth-child(3) { animation-delay: 0.3s; }
    .country-card:nth-child(4) { animation-delay: 0.4s; }
    .country-card:nth-child(5) { animation-delay: 0.5s; }
    .country-card:nth-child(6) { animation-delay: 0.6s; }
    .country-card:nth-child(7) { animation-delay: 0.7s; }
    .country-card:nth-child(8) { animation-delay: 0.8s; }
    .country-card:nth-child(9) { animation-delay: 0.9s; }
    .country-card:nth-child(10) { animation-delay: 1.0s; }
    
    .country-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    
    .country-card h3 {
      margin: 12px 0 5px;
      font-size: 1.2em;
      transition: color 0.3s ease;
    }
    
    .country-card p {
      margin: 6px;
      font-size: 0.9em;
      color: #666;
      transition: color 0.3s ease;
    }

      transform: scale(1.03);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }
    
    .country-card:hover img {
      transform: scale(1.05);
    }
    
    .country-card:hover h3 {
      color: #f39c12;
    }
    
    .country-card .discover-btn {
      margin: 12px auto;
      padding: 6px 15px;
      font-size: 0.85em;
    }

      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .top10-title {
      text-align: center;
      font-size: 2em;
      margin-bottom: 30px;
      color: #333;
      opacity: 0;
      animation: fadeInTitle 0.5s ease forwards;
    }
    
    @keyframes fadeInTitle {
      to { opacity: 1; }
    }

      text-align: center;
      padding: 20px;
      font-size: 1.2em;
      color: #666;
    }
    
    #countryModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
    }
    
    .modal-content {
      background: #fff;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      opacity: 0;
      transform: scale(0.8);
      animation: modalPop 0.3s ease forwards;
    }
    
    @keyframes modalPop {
      to { opacity: 1; transform: scale(1); }
    }

      }

    }

function enrichCountryData(country, ratings) {
  const name = country.name.common;
  const info = ratings[name] || {
    city: country.capital ? country.capital[0] : "Unknown",
    famous: "Culture, landscapes, or history",
    rating: 4.0
  };
  return {
    ...country,
    rating: info.rating,
    mostVisitedCity: info.city,
    famousFor: info.famous
  };
}

async function loadAllCountries() {
  try {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Loading...</p>';
    document.querySelector('.top10-title').textContent = 'All Countries';
    document.querySelectorAll('.continent-tabs button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
    document.getElementById('allCountriesLink').classList.add('active');
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
    const data = await response.json();
    const enrichedCountries = data.map(country => enrichCountryData(country, countryRatings));
    enrichedCountries.sort((a, b) => a.name.common.localeCompare(b.name.common));
    displayCountries(enrichedCountries);
  } catch (error) {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Failed to load data. Please check your connection and try again.</p>';
  }
}

async function loadContinent(continent) {
  try {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Loading...</p>';
    document.querySelector('.top10-title').textContent = continent;
    document.querySelectorAll('.continent-tabs button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
    const continentButton = document.querySelector(`button[onclick="loadContinent('${continent}')"]`);
    if (continentButton) continentButton.classList.add('active');
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
    const data = await response.json();
    const filtered = data.filter(c => {
      const regionMatch = c.region === continent;
      const subregionMatch = c.subregion === continent;
      const oceaniaFix = continent === "Oceania" && c.region === "Oceania";
      const antarcticaFix = continent === "Antarctic" && c.region === "Antarctic";
      return regionMatch || subregionMatch || oceaniaFix || antarcticaFix;
    });
    const enrichedCountries = filtered.map(country => enrichCountryData(country, countryRatings));
    enrichedCountries.sort((a, b) => a.name.common.localeCompare(b.name.common));
    displayCountries(enrichedCountries);
  } catch (error) {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Failed to load data. Please check your connection and try again.</p>';
  }
}

function displayCountries(countries) {
  const grid = document.getElementById('countryGrid');
  grid.innerHTML = '';
  if (!countries.length) {
    grid.innerHTML = '<p class="loading">No countries found.</p>';
    return;
  }
  countries.forEach(country => {
    const card = document.createElement('div');
    card.classList.add('country-card');
    const flag = country.flags?.png || 'https://via.placeholder.com/300x150?text=No+Image';
    const name = country.name?.common || 'Unknown';
    const capital = country.capital?.[0] || 'N/A';
    const city = country.mostVisitedCity || 'Unknown';
    const famous = country.famousFor || 'N/A';
    const rating = country.rating || 4.0;
    card.innerHTML = `
      <img src="${flag}" alt="Flag of ${name}">
      <h3>${name}</h3>
      <p>Capital: ${capital}</p>
      <p>Most Visited City: ${city}</p>
      <p>Famous For: ${famous}</p>
      <p>Rating: ⭐ ${rating}/5</p>
      <button class="discover-btn">Discover Now</button>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('discover-btn')) {
        openModal(country);
      } else {
        openModal(country);
      }
    });
    grid.appendChild(card);
  });
}

async function loadTop10Countries() {
  try {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Loading...</p>';
    document.querySelector('.top10-title').textContent = 'Top 10 Countries';
    document.querySelectorAll('.continent-tabs button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
    document.getElementById('top10Link').classList.add('active');
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
    const data = await response.json();
    const top10Names = ['France', 'Spain', 'United States', 'China', 'Italy', 'Turkey', 'Mexico', 'Thailand', 'Germany', 'United Kingdom'];
    const top10 = top10Names
      .map(name => {
        const country = data.find(c => c.name.common === name);
        if (!country) return null;
        return enrichCountryData(country, countryRatings);
      })
      .filter(Boolean)
      .sort((a, b) => b.rating - a.rating);
    displayCountries(top10);
  } catch (err) {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Failed to load data. Please check your connection and try again.</p>';
  }
}

function openModal(country) {
  document.getElementById('modalTitle').textContent = country.name.common || 'Unknown';
  document.getElementById('modalDetails').innerHTML = `
    Population: ${country.population?.toLocaleString() || 'N/A'}<br>
    Languages: ${Object.values(country.languages || {}).join(', ') || 'N/A'}<br>
    Famous For: ${country.famousFor || 'N/A'}
  `;
  document.getElementById('countryModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('countryModal').style.display = 'none';
}

document.getElementById('countrySearch').addEventListener('input', async (e) => {
  try {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Loading...</p>';
    document.querySelector('.top10-title').textContent = 'Search Results';
    document.querySelectorAll('.continent-tabs button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
    const query = e.target.value.toLowerCase();
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
    const data = await response.json();
    const filtered = data
      .filter(c => c.name.common.toLowerCase().includes(query))
      .map(country => enrichCountryData(country, countryRatings));
    displayCountries(filtered);
  } catch (error) {
    document.getElementById('countryGrid').innerHTML = '<p class="loading">Failed to load data. Please check your connection and try again.</p>';
  }
});

window.onload = function() {
  loadTop10Countries();
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
      e.preventDefault();
      const href = this.getAttribute('href');
      if (href === '#top10') {
        loadTop10Countries();
      } else if (href === '#all-countries') {
        loadAllCountries();
      }
      document.querySelector(href).scrollIntoView({
        behavior: 'smooth'
      });
    });
  });
};
